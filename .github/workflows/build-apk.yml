name: Build Hadota WiFi Manager v1.6.1 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'patches/v1.6.1/stabilize_webview.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract and patch project
        run: |
          mkdir -p source
          unzip -q Hadota-WiFi-Manager-Development-v1.6.0.zip -d source
          python3 patches/v1.6.1/stabilize_webview.py
          test -f source/Hadota-WiFi-Manager-Android/settings.gradle
      - name: Build debug APK
        working-directory: source/Hadota-WiFi-Manager-Android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-WiFi-Manager-v1.6.1-debug
          path: source/Hadota-WiFi-Manager-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
