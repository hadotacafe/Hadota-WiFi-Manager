name: Build Hadota WiFi Manager APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Hadota_WiFi_Manager_Android_Project*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source
          test -f source/Hadota_WiFi_Manager_Android/package.json
      - name: Install dependencies
        working-directory: source/Hadota_WiFi_Manager_Android
        run: npm install
      - name: Add Android platform
        working-directory: source/Hadota_WiFi_Manager_Android
        run: npx cap add android
      - name: Add router connection screen
        working-directory: source/Hadota_WiFi_Manager_Android
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          s=p.read_text()
          panel = '''
          <section class="group" id="router-connection">
            <div class="row"><b>اتصال الراوتر</b><span class="tag">اختبار محلي</span></div>
            <div class="field"><label>عنوان الراوتر</label><input id="routerHost" value="192.168.1.1" inputmode="url"></div>
            <div class="note">اتصل بشبكة Hadota cafe. الاختبار لا يسجل الدخول ولا يغير إعدادات الراوتر.</div>
            <button class="btn" style="width:100%;margin-top:10px" id="probeRouter">اختبار الاتصال</button>
            <button class="btn" style="width:100%;margin-top:8px" id="inspectRouter">فحص صفحة دخول الراوتر</button>
            <button class="btn" style="width:100%;margin-top:8px" id="scanRouterScripts">تحليل ملفات الراوتر</button>
            <div class="connection-result" id="routerResult" style="font-size:12px;margin-top:10px">لم يتم الاختبار بعد.</div>
          </section>
          '''
          s=s.replace('<section class="card">', panel+'\n<section class="card">',1)
          credentials = '''
          <section class="group" id="router-credentials">
            <div class="row"><b>بيانات دخول الراوتر</b><span class="tag">حفظ مشفر محليًا</span></div>
            <div class="field"><label>اسم المستخدم</label><input id="routerUsername" autocomplete="username" placeholder="اسم مستخدم الراوتر"></div>
            <div class="field"><label>كلمة المرور</label><input id="routerPassword" type="password" autocomplete="current-password" placeholder="كلمة مرور الراوتر"></div>
            <div class="note">تُشفّر البيانات داخل Android Keystore وتُحفظ على هذا الهاتف فقط. لا تُرسل إلى GitHub أو المحادثة.</div>
            <button class="btn" style="width:100%;margin-top:10px" id="saveRouterCredentials">حفظ بيانات الدخول على الجهاز</button>
            <button class="btn" style="width:100%;margin-top:8px" id="clearRouterCredentials">مسح بيانات الدخول المحفوظة</button>
            <div id="credentialStatus" class="connection-result" style="font-size:12px;margin-top:8px">جارٍ التحقق من حالة الحفظ...</div>
          </section>
          '''
          s=s.replace('<section class="card">', credentials+'\\n<section class="card">',1)

          script = """
          document.getElementById('probeRouter').addEventListener('click', async () => {
            const out=document.getElementById('routerResult');
            const host=document.getElementById('routerHost').value.trim();
            out.textContent='جارٍ اختبار الاتصال...';
            try {
              const bridge=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RouterBridge;
              if(!bridge){out.textContent='خدمة الاتصال غير موجودة في هذا الإصدار.';return;}
              const result=await bridge.probe({host});
              out.textContent=result.message || 'انتهى الاختبار';
            } catch(e) { out.textContent='فشل الاختبار: '+(e.message||String(e)); }
          });
          """
          script += """
          document.getElementById('inspectRouter').addEventListener('click', async () => {
            const out=document.getElementById('routerResult');
            const host=document.getElementById('routerHost').value.trim();
            out.textContent='جارٍ فحص صفحة الدخول محليًا...';
            try {
              const bridge=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RouterBridge;
              if(!bridge){out.textContent='خدمة الاتصال غير موجودة في هذا الإصدار.';return;}
              const result=await bridge.inspectLogin({host});
              out.textContent=result.message || 'انتهى الفحص';
            } catch(e) { out.textContent='فشل الفحص: '+(e.message||String(e)); }
          });
          """
          script += """
          document.getElementById('scanRouterScripts').addEventListener('click', async () => {
            const out=document.getElementById('routerResult');
            const host=document.getElementById('routerHost').value.trim();
            out.textContent='جارٍ تحليل ملفات الراوتر محليًا...';
            try {
              const bridge=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RouterBridge;
              if(!bridge){out.textContent='خدمة الاتصال غير موجودة في هذا الإصدار.';return;}
              const result=await bridge.inspectScripts({host});
              out.textContent=result.message || 'انتهى التحليل';
            } catch(e) { out.textContent='فشل التحليل: '+(e.message||String(e)); }
          });
          """
          script += """
          (async () => {
            const bridge=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RouterBridge;
            const status=document.getElementById('credentialStatus');
            if(!bridge){status.textContent='خدمة الحفظ الآمن غير متاحة في هذا الإصدار.';return;}
            try { const r=await bridge.credentialsStored(); status.textContent=r.stored?'توجد بيانات دخول محفوظة ومشفرة على هذا الجهاز.':'لا توجد بيانات دخول محفوظة بعد.'; }
            catch(e){status.textContent='تعذر قراءة حالة الحفظ الآمن.';}
          })();
          document.getElementById('saveRouterCredentials').addEventListener('click', async () => {
            const status=document.getElementById('credentialStatus');
            const username=document.getElementById('routerUsername').value;
            const password=document.getElementById('routerPassword').value;
            status.textContent='جارٍ التشفير والحفظ على الجهاز...';
            try {
              const bridge=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RouterBridge;
              const r=await bridge.saveCredentials({username,password});
              document.getElementById('routerPassword').value='';
              status.textContent=r.message || 'تم الحفظ المشفر على الجهاز.';
            } catch(e){status.textContent='فشل الحفظ: '+(e.message||String(e));}
          });
          document.getElementById('clearRouterCredentials').addEventListener('click', async () => {
            const status=document.getElementById('credentialStatus');
            try {
              const bridge=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.RouterBridge;
              await bridge.clearCredentials();
              document.getElementById('routerUsername').value='';
              document.getElementById('routerPassword').value='';
              status.textContent='تم مسح بيانات الدخول المحفوظة من هذا الجهاز.';
            } catch(e){status.textContent='تعذر مسح البيانات: '+(e.message||String(e));}
          });
          """
          s=s.replace('</body>', '<script>'+script+'</script>\n</body>',1)
          p.write_text(s)
          PY
      - name: Install local router bridge
        working-directory: source/Hadota_WiFi_Manager_Android
        run: |
          APP=android/app/src/main
          DEST="$APP/java/com/hadotacafe/wifimanager"
          mkdir -p "$DEST"
          cp "$GITHUB_WORKSPACE/android-bridge/RouterBridgePlugin.java" "$DEST/"
          MAIN="$DEST/MainActivity.java"
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/java/com/hadotacafe/wifimanager/MainActivity.java")
          s=p.read_text()
          s=s.replace("public class MainActivity extends BridgeActivity {", """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(RouterBridgePlugin.class);
                  super.onCreate(savedInstanceState);
              }""")
          p.write_text(s)
          m=Path("android/app/src/main/AndroidManifest.xml")
          t=m.read_text()
          t=t.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />' + chr(10) + '    <application',1)
          t=t.replace("<application", '<application android:usesCleartextTraffic="true"',1)
          m.write_text(t)
          PY
      - name: Sync Android project
        working-directory: source/Hadota_WiFi_Manager_Android
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        working-directory: source/Hadota_WiFi_Manager_Android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hadota-WiFi-Manager-router-bridge
          path: source/Hadota_WiFi_Manager_Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
