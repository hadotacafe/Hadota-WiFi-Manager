name: Build Hadota WiFi Manager v1.7.7 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'patches/v1.6.1/stabilize_webview.py'
      - 'patches/inspect_source.py'
      - 'patches/v1.6.2/separate_router_webview.py'
      - 'patches/v1.6.3/router_full_readonly_scan.py'
      - 'patches/v1.6.4/automatic_authenticated_scan.py'
      - 'patches/v1.6.7/session_bound_router_scan.py'
      - 'patches/v1.6.8/router_mobile_layout.py'
      - 'patches/v1.6.9/direct_router_webview.py'
      - 'patches/v1.7.0/router_navigation_guard.py'
      - 'patches/v1.7.1/stabilize_router_test.py'
      - 'patches/v1.7.2/live_inventory_bridge.py'
      - 'patches/v1.7.3/session_dom_inventory.py'
      - 'patches/v1.7.4/full_router_page_inspector.py'
      - 'patches/v1.7.5/router_api_discovery.py'
      - 'patches/v1.7.6/inline_script_inspector.py'
      - 'patches/v1.7.7/live_client_row_parser.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract and patch project
        run: |
          mkdir -p source
          unzip -q Hadota-WiFi-Manager-Development-v1.6.0.zip -d source
          python3 patches/v1.6.1/stabilize_webview.py
          python3 patches/v1.6.2/separate_router_webview.py
          python3 patches/v1.6.3/router_full_readonly_scan.py
          python3 patches/v1.6.4/automatic_authenticated_scan.py
          python3 patches/v1.6.7/session_bound_router_scan.py
          python3 patches/v1.6.8/router_mobile_layout.py
          python3 patches/v1.6.9/direct_router_webview.py
          python3 patches/v1.7.0/router_navigation_guard.py
          python3 patches/v1.7.1/stabilize_router_test.py
          python3 patches/v1.7.2/live_inventory_bridge.py
          python3 patches/v1.7.3/session_dom_inventory.py
          python3 patches/v1.7.4/full_router_page_inspector.py
          python3 patches/v1.7.5/router_api_discovery.py
          python3 patches/v1.7.6/inline_script_inspector.py
          python3 patches/v1.7.7/live_client_row_parser.py
          test -f source/Hadota-WiFi-Manager-Android/settings.gradle
      - name: Upload complete patched Android project
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-WiFi-Manager-v1.7.7-full-source
          path: source/Hadota-WiFi-Manager-Android/
          if-no-files-found: error
      - name: Extract source for crash diagnosis
        run: python3 patches/inspect_source.py
      - name: Upload source inspection
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-WiFi-Manager-source-inspection
          path: source-inspection/
          if-no-files-found: error
      - name: Build debug APK
        working-directory: source/Hadota-WiFi-Manager-Android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-WiFi-Manager-v1.7.7-debug
          path: source/Hadota-WiFi-Manager-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
