name: Build Hadota WiFi Manager v1.9.27 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'patches/v1.6.1/stabilize_webview.py'
      - 'patches/inspect_source.py'
      - 'patches/v1.6.2/separate_router_webview.py'
      - 'patches/v1.6.3/router_full_readonly_scan.py'
      - 'patches/v1.6.4/automatic_authenticated_scan.py'
      - 'patches/v1.6.7/session_bound_router_scan.py'
      - 'patches/v1.6.8/router_mobile_layout.py'
      - 'patches/v1.6.9/direct_router_webview.py'
      - 'patches/v1.7.0/router_navigation_guard.py'
      - 'patches/v1.7.1/stabilize_router_test.py'
      - 'patches/v1.7.2/live_inventory_bridge.py'
      - 'patches/v1.7.3/session_dom_inventory.py'
      - 'patches/v1.7.4/full_router_page_inspector.py'
      - 'patches/v1.7.5/router_api_discovery.py'
      - 'patches/v1.7.6/inline_script_inspector.py'
      - 'patches/v1.7.7/live_client_row_parser.py'
      - 'patches/v1.8.1/native_import_overlay_verified.py'
      - 'patches/v1.8.2/force_visible_import_button.py'
      - 'patches/v1.8.3/staff_roster_manager.py'
      - 'patches/v1.8.4/fix_import_button_position.py'
      - 'patches/v1.9.0/premium_ui_and_launcher_icon.py'
      - 'patches/v1.9.3/import_button_action_guard.py'
      - 'patches/v1.9.4/classify_imported_staff_devices.py'
      - 'patches/v1.9.5/show_import_button_only_on_router.py'
      - 'patches/v1.9.6/fix_staff_classification_click.py'
      - 'patches/v1.9.7/keep_router_open_when_no_clients.py'
      - 'patches/v1.9.8/in_app_staff_classification_modal.py'
      - 'patches/v1.9.9/direct_staff_classification_actions.py'
      - 'patches/v1.9.10/one_tap_staff_classification.py'
      - 'patches/v1.9.11/robust_staff_classify_click.py'
      - 'patches/v1.9.12/last_seen_connection_status.py'
      - 'patches/v1.9.13/isolate_router_test_executor.py'
      - 'patches/v1.9.14/router_test_watchdog.py'
      - 'patches/v1.9.15/keep_android_bridge_on_return.py'
      - 'patches/v1.9.17/force_dedicated_router_activity.py'
      - 'patches/v1.9.18/import_devices_from_router_scan.py'
      - 'patches/v1.9.19/automatic_router_client_page_crawl.py'
      - 'patches/v1.9.23/keep_router_open_on_empty_scan.py'
      - 'patches/v1.9.24/capture_only_when_clients_found.py'
      - 'patches/v1.9.25/always_return_from_router.py'
      - 'patches/v1.9.26/frame_aware_client_extraction.py'
      - 'patches/v1.9.27/repair_frame_scan_java_string.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract and patch project
        run: |
          mkdir -p source
          unzip -q Hadota-WiFi-Manager-Development-v1.6.0.zip -d source
          python3 patches/v1.6.1/stabilize_webview.py
          python3 patches/v1.6.2/separate_router_webview.py
          python3 patches/v1.6.3/router_full_readonly_scan.py
          python3 patches/v1.6.4/automatic_authenticated_scan.py
          python3 patches/v1.6.7/session_bound_router_scan.py
          python3 patches/v1.6.8/router_mobile_layout.py
          python3 patches/v1.6.9/direct_router_webview.py
          python3 patches/v1.7.0/router_navigation_guard.py
          python3 patches/v1.7.1/stabilize_router_test.py
          python3 patches/v1.7.2/live_inventory_bridge.py
          python3 patches/v1.7.3/session_dom_inventory.py
          python3 patches/v1.7.4/full_router_page_inspector.py
          python3 patches/v1.7.5/router_api_discovery.py
          python3 patches/v1.7.6/inline_script_inspector.py
          python3 patches/v1.7.7/live_client_row_parser.py
          python3 patches/v1.8.1/native_import_overlay_verified.py
          python3 patches/v1.8.2/force_visible_import_button.py
          python3 patches/v1.8.3/staff_roster_manager.py
          python3 patches/v1.9.0/premium_ui_and_launcher_icon.py
          python3 patches/v1.8.4/fix_import_button_position.py
          python3 patches/v1.9.3/import_button_action_guard.py
          python3 patches/v1.9.4/classify_imported_staff_devices.py
          python3 patches/v1.9.5/show_import_button_only_on_router.py
          python3 patches/v1.9.6/fix_staff_classification_click.py
          python3 patches/v1.9.7/keep_router_open_when_no_clients.py
          python3 patches/v1.9.8/in_app_staff_classification_modal.py
          python3 patches/v1.9.9/direct_staff_classification_actions.py
          python3 patches/v1.9.10/one_tap_staff_classification.py
          python3 patches/v1.9.11/robust_staff_classify_click.py
          python3 patches/v1.9.12/last_seen_connection_status.py
          python3 patches/v1.9.13/isolate_router_test_executor.py
          python3 patches/v1.9.14/router_test_watchdog.py
          python3 patches/v1.9.15/keep_android_bridge_on_return.py
          python3 patches/v1.9.17/force_dedicated_router_activity.py
          python3 patches/v1.9.18/import_devices_from_router_scan.py
          python3 patches/v1.9.19/automatic_router_client_page_crawl.py
          python3 patches/v1.9.23/keep_router_open_on_empty_scan.py
          python3 patches/v1.9.24/capture_only_when_clients_found.py
          python3 patches/v1.9.25/always_return_from_router.py
          python3 patches/v1.9.26/frame_aware_client_extraction.py
          python3 patches/v1.9.27/repair_frame_scan_java_string.py
          test -f source/Hadota-WiFi-Manager-Android/settings.gradle
      - name: Upload complete patched Android project
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-WiFi-Manager-v1.9.27-full-source
          path: source/Hadota-WiFi-Manager-Android/
          if-no-files-found: error
      - name: Extract source for crash diagnosis
        run: python3 patches/inspect_source.py
      - name: Upload source inspection
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-WiFi-Manager-source-inspection
          path: source-inspection/
          if-no-files-found: error
      - name: Build debug APK
        working-directory: source/Hadota-WiFi-Manager-Android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadota-WiFi-Manager-v1.9.27-debug
          path: source/Hadota-WiFi-Manager-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
